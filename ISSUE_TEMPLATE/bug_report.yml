name: Bug report
description: Report a reproducible bug in a Pulseq repository
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please provide enough information for maintainers to reproduce the issue.

  - type: input
    id: repository
    attributes:
      label: Repository
      description: Which Pulseq repository does this affect?
      placeholder: "e.g., pypulseq, pulseq, examples"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Package version, release, branch, or commit hash.
      placeholder: "e.g., v1.4.2, main, commit hash"
    validations:
      required: false

  - type: dropdown
    id: implementation
    attributes:
      label: Implementation
      options:
        - MATLAB Pulseq
        - PyPulseq
        - Both MATLAB and PyPulseq
        - Specification or file format
        - Other or unknown
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
      placeholder: "Describe the observed behavior."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal steps to reproduce
      description: Provide code, commands, sequence files, or steps.
      render: bash
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/MATLAB version, package versions, scanner/vendor context if relevant.
      placeholder: |
        OS:
        Python or MATLAB version:
        Pulseq/PyPulseq version:
        Scanner/vendor context, if relevant:
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add logs, screenshots, files, or links if useful.
    validations:
      required: false